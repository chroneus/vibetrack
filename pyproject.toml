[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibetrack"
version = "0.1a0"
description = "Lightweight experiment tracking — drop-in compatible with TensorBoard and W&B APIs."
readme = "README.md"
authors = [
  { name = "Sergei Chicherin", email = "serenkiy@ieee.org" },
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "python-multipart>=0.0.5",
    "psutil>=5.9",
]

[project.optional-dependencies]
media = ["numpy", "Pillow"]
telegram = ["python-telegram-bot>=20.0"]
slack = []
gradio = ["gradio>=3.0"]
all = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "python-multipart>=0.0.5",
    "mcp>=1.0; python_version >= '3.10'",
    "psutil>=5.9",
    "numpy",
    "Pillow",
    "gradio>=3.0",
    "python-telegram-bot>=20.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx>=0.24.0",
]

[project.scripts]
vibetrack = "vibetrack.cli:main"

[project.urls]
"Homepage" = "https://github.com/chroneus/vibetrack"
"Bug Tracker" = "https://github.com/chroneus/vibetrack/issues"

[tool.setuptools.packages.find]
include = ["vibetrack*"]

[tool.setuptools.package-data]
vibetrack = ["viewers/web/index.html", "viewers/web/css/*.css", "viewers/web/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
