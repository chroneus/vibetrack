[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibetrack"
version = "0.1.1"
description = "Modern experiment tracking — drop-in compatible with TensorBoard SummaryWriter."
readme = "README.md"
authors = [
  { name = "Sergei Chicherin", email = "serenkiy@ieee.org" },
]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "python-multipart>=0.0.5",
    "psutil>=5.9",
]

[project.optional-dependencies]
telegram = ["python-telegram-bot>=20.0"]
all = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "python-multipart>=0.0.5",
    "mcp>=1.0; python_version >= '3.10'",
    "psutil>=5.9",
    "numpy",
    "Pillow",
    "gradio>=6.0,<7",
    "python-telegram-bot>=20.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx>=0.24.0",
]

[project.scripts]
vibetrack = "vibetrack.cli:main"

[project.urls]
"Homepage" = "https://github.com/chroneus/vibetrack"
"Bug Tracker" = "https://github.com/chroneus/vibetrack/issues"

[tool.setuptools.packages.find]
include = ["vibetrack*"]

[tool.setuptools.package-data]
vibetrack = [
  "viewers/web/index.html",
  "viewers/web/css/*.css",
  "viewers/web/js/*.js",
  "viewers/web/vendor/*.js",
  "viewers/web/vendor/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
