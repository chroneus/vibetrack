name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint with ruff
        # Rules are pinned in pyproject.toml; pin the binary too so a new
        # ruff release can't turn the job red overnight.
        run: |
          pip install ruff==0.17.6
          ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest]
        include:
          # setup-python has no 3.8/3.9 builds for ubuntu-latest (24.04)
          - python-version: "3.8"
            os: ubuntu-22.04
          - python-version: "3.9"
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          pip install -e ".[mcp]" pytest pytest-cov httpx numpy Pillow

      - name: Run tests
        run: pytest
