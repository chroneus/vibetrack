<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vibetrack</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/img-comparison-slider@8/dist/index.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/img-comparison-slider@8/dist/styles.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <script>
    window.VT_DATA = __DATA_JSON__;
    window.VT_PROJECT = __PROJECT_JSON__;
    window.VT_PROJECTS = __PROJECTS_JSON__;
  </script>
  <script defer src="/static/js/core.js"></script>
  <script defer src="/static/js/charts.js"></script>
  <script defer src="/static/js/pills.js"></script>
  <script defer src="/static/js/media.js"></script>
  <script defer src="/static/js/settings.js"></script>
  <script defer src="/static/js/main.js"></script>
</head>

<body>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;">
    <h1 style="margin:0;position:relative;">
      <span id="project-name">vibetrack</span>
      <div id="project-menu"></div>
    </h1>
  </div>

  <div class="tabs" id="main-tabs"></div>

  <!-- Scalars -->
  <div class="tab-content" id="tab-scalars">
    <div class="controls">
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:0.85em;color:var(--muted);">Experiments</span>
        <div class="exp-pills" id="exp-pills"></div>
      </div>
    </div>
    <div class="grid" id="charts"></div>
    <div class="hidden-tray collapsed" id="hidden-charts-tray" style="display:none;">
      <div class="hidden-tray-header" id="hidden-charts-toggle">
        <span class="caret">&#9662;</span>
        <span>Hidden charts (<span id="hidden-charts-count">0</span>) — click to restore</span>
      </div>
      <div class="hidden-tray-list" id="hidden-charts-list"></div>
    </div>
  </div>

  <!-- Images -->
  <div class="tab-content" id="tab-images">
    <div id="images-container"></div>
  </div>

  <!-- Audio -->
  <div class="tab-content" id="tab-audio">
    <div id="audio-list"></div>
  </div>

  <!-- Video -->
  <div class="tab-content" id="tab-video">
    <div class="media-grid" id="video-grid"></div>
  </div>

  <!-- Artifacts -->
  <div class="tab-content" id="tab-artifacts">
    <table class="artifacts-table" id="artifacts-table">
      <thead>
        <tr>
          <th>Experiment</th>
          <th>Tag</th>
          <th>Step</th>
          <th>Filename</th>
          <th>Size</th>
          <th>Type</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="artifacts-body"></tbody>
    </table>
  </div>

  <!-- Text -->
  <div class="tab-content" id="tab-text">
    <div id="text-list"></div>
  </div>

  <!-- Histograms -->
  <div class="tab-content" id="tab-histograms">
    <div class="grid" id="histogram-charts"></div>
  </div>

  <!-- System -->
  <div class="tab-content" id="tab-system">
    <div class="grid" id="system-charts"></div>
  </div>

  <!-- Settings -->
  <div class="tab-content" id="tab-settings">
    <div class="settings-card" id="project-info-card" style="display:none;">
      <h2>Project Info</h2>
      <div id="project-info-content"></div>
    </div>
    <div class="settings-card">
      <h2>Look &amp; Feel</h2>
      <div class="settings-row">
        <label>Theme</label>
        <select id="cfg-theme">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
          <option value="orange">Orange</option>
        </select>
      </div>
      <div class="settings-row">
        <label>Auto-refresh (sec)</label>
        <input type="number" id="cfg-refresh" value="0" min="0" step="5" style="width:80px;">
      </div>
      <div class="settings-row">
        <label>Image play FPS</label>
        <select id="cfg-image-fps">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="4">4</option>
          <option value="8">8</option>
          <option value="12">12</option>
          <option value="24">24</option>
        </select>
      </div>
    </div>
    <div class="settings-card">
      <h2>Scalar chart smoothing</h2>
      <div class="settings-row">
        <label>Smoothing method</label>
        <select id="cfg-smoothing">
          <option value="ema">EMA</option>
          <option value="moving_average">Simple moving average</option>
          <option value="gaussian">Gaussian</option>
        </select>
      </div>
      <div class="settings-row">
        <label>Smoothing strength</label>
        <input type="range" id="cfg-smooth-weight" min="0" max="0.99" step="0.01" value="0">
        <span class="smooth-val" id="cfg-smooth-weight-val">0</span>
      </div>
      <div class="settings-row">
        <label>Raw data opacity</label>
        <input type="range" id="cfg-raw-opacity" min="0" max="0.8" step="0.01" value="0">
        <span class="smooth-val" id="cfg-raw-opacity-val">0</span>
      </div>
      <div class="settings-row">
        <label>X-axis</label>
        <select id="cfg-x-axis">
          <option value="step">Step</option>
          <option value="wall_time">Wall time</option>
        </select>
      </div>
    </div>
    <div class="settings-card">
      <h2>System metrics</h2>
      <div class="settings-row">
        <label>Collect interval</label>
        <select id="cfg-sys-interval">
          <option value="none">None</option>
          <option value="once">Once (before run)</option>
          <option value="60">Every minute</option>
          <option value="600">Every 10 minutes</option>
          <option value="3600">Every hour</option>
          <option value="86400">Daily</option>
        </select>
      </div>
    </div>
    <div class="settings-card" id="danger-zone-card" style="display:none;">
      <h2>Danger zone</h2>
      <div class="settings-row">
        <label>Delete project</label>
        <button id="delete-project-btn" type="button">Delete project and all data</button>
      </div>
    </div>
  </div>
</body>

</html>
