name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint with ruff
        # Rules are pinned in pyproject.toml; pin the binary too so a new
        # ruff release can't turn the job red overnight.
        run: |
          pip install ruff==0.17.6
          ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest]
        include:
          # setup-python has no 3.8/3.9 builds for ubuntu-latest (24.04)
          - python-version: "3.8"
            os: ubuntu-22.04
          - python-version: "3.9"
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        if: matrix.python-version != '3.8'
        run: |
          pip install -e ".[mcp]" pytest pytest-cov httpx numpy Pillow

      # The build backend needs setuptools>=77 (PEP 639 license field), which
      # has no Python 3.8 release, so the package cannot be built here. Test
      # the source tree with the runtime dependencies read from pyproject.toml;
      # the pure-Python wheel published from a newer Python installs on 3.8.
      - name: Install dependencies without building (Python 3.8)
        if: matrix.python-version == '3.8'
        run: |
          pip install tomli
          python -c "import tomli; print('\n'.join(tomli.load(open('pyproject.toml', 'rb'))['project']['dependencies']))" > "$RUNNER_TEMP/requirements.txt"
          pip install -r "$RUNNER_TEMP/requirements.txt" pytest pytest-cov httpx numpy Pillow
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Run tests
        run: pytest
