<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vibetrack</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/img-comparison-slider@8/dist/index.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/img-comparison-slider@8/dist/styles.css">
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #58a6ff;
      --muted: #8b949e;
      --grid: #21262d;
    }

    body.light {
      --bg: #ffffff;
      --card: #f6f8fa;
      --border: #d0d7de;
      --text: #1f2328;
      --accent: #0969da;
      --muted: #656d76;
      --grid: #e1e4e8;
    }

    body.orange {
      --bg: #fafafa;
      --card: #ffffff;
      --border: #e0e0e0;
      --text: #212121;
      --accent: #e65100;
      --muted: #757575;
      --grid: #eeeeee;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }

    h1 {
      color: var(--accent);
      margin-bottom: 8px;
      font-size: 1.4em;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .tabs button {
      background: none;
      border: none;
      color: var(--muted);
      padding: 10px 20px;
      cursor: pointer;
      font-size: 0.9em;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .tabs button:hover {
      color: var(--text);
    }

    .tabs button.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Controls bar */
    .controls {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .controls label {
      font-size: 0.85em;
      color: var(--muted);
    }

    .controls input[type=range] {
      width: 160px;
    }

    input[type=range],
    input[type=checkbox] {
      accent-color: var(--accent);
    }

    .smooth-val {
      display: inline-block;
      width: 36px;
      text-align: center;
    }

    /* Experiment pills */
    .exp-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .exp-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px 3px 8px;
      border: 1px solid var(--border);
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.82em;
      color: var(--muted);
      transition: all 0.15s;
      user-select: none;
    }

    .exp-pill:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .exp-pill.active {
      border-color: var(--accent);
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
    }

    .exp-pill .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .exp-pill .rename-btn {
      opacity: 0;
      margin-left: 2px;
      color: var(--muted);
      font-size: 0.85em;
      cursor: pointer;
      transition: opacity 0.15s;
      flex-shrink: 0;
    }

    .exp-pill:hover .rename-btn {
      opacity: 1;
    }

    .exp-pill .rename-btn:hover {
      color: var(--accent);
    }

    .exp-pill .delete-btn {
      opacity: 0;
      margin-left: 2px;
      color: var(--muted);
      cursor: pointer;
      transition: opacity 0.15s;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
    }

    .exp-pill:hover .delete-btn {
      opacity: 1;
    }

    .exp-pill .delete-btn:hover {
      color: #e74c3c;
    }

    #project-name.has-menu {
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    #project-name.has-menu:hover {
      background: var(--border);
    }
    #project-name.has-menu::after {
      content: ' \25BE';
      font-size: 1em;
      color: var(--accent);
    }

    #project-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      z-index: 999;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 0;
      min-width: 160px;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
      margin-top: 4px;
    }
    #project-menu.open {
      display: block;
    }
    #project-menu a {
      display: block;
      padding: 6px 14px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.55em;
      font-weight: normal;
      white-space: nowrap;
    }
    #project-menu a:hover {
      background: var(--border);
    }
    #project-menu a.active {
      color: var(--accent);
      font-weight: 600;
    }

    #delete-project-btn:hover {
      color: #e74c3c;
    }

    .exp-rename-input {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--accent);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.82em;
      outline: none;
      min-width: 80px;
    }

    /* Charts grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(520px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      position: relative;
    }

    .card h2 {
      font-size: 0.95em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    canvas {
      width: 100% !important;
      height: 280px !important;
    }

    /* Media */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .media-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    .media-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    .media-card video {
      width: 100%;
      height: auto;
      display: block;
    }

    .media-card audio {
      width: 100%;
      margin: 8px 0;
    }

    .media-card .label {
      padding: 8px 12px;
      font-size: 0.8em;
      color: var(--muted);
    }

    .media-card .label .tag {
      color: var(--accent);
    }

    .media-card .label .exp {
      /* color set dynamically via expColors */
    }

    /* Image viewer */
    .img-tag-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .img-tag-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
    }
    .img-tag-header .expand-btn { position: static; opacity: 1; }

    .img-tag-header h3 {
      font-size: 0.9em;
      color: var(--accent);
      margin: 0;
    }

    .img-tag-body {
      padding: 16px;
    }

    /* Animate mode */
    .img-animate {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .img-animate-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .img-animate-controls button {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      width: 32px;
      height: 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .img-animate-controls button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .img-animate-controls input[type=range] {
      flex: 1;
      min-width: 120px;
    }

    .img-animate-controls .step-label {
      font-size: 0.85em;
      color: var(--accent);
      font-weight: 600;
      min-width: 80px;
    }

    .img-animate-controls label {
      font-size: 0.82em;
      color: var(--muted);
      white-space: nowrap;
    }

    .img-animate-controls select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 0.82em;
    }

    .img-animate-viewport {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px;
    }

    .img-animate-viewport .animate-cell {
      text-align: center;
    }

    .img-animate-viewport .animate-cell img {
      width: 100%;
      height: auto;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .img-animate-viewport .animate-cell .cell-label {
      font-size: 0.78em;
      color: var(--muted);
      margin-top: 4px;
    }

    .img-animate-viewport .animate-cell .cell-label .exp {
      /* color set dynamically via expColors */
    }

    /* Image selection & compare */
    .animate-cell {
      position: relative;
    }

    .img-select-cb {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 2;
    }

    .animate-cell:hover .img-select-cb,
    .img-select-cb:checked {
      opacity: 1;
    }

    .animate-cell.img-selected {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
      border-radius: 4px;
    }

    .compare-toolbar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 900;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .compare-toolbar span {
      color: var(--muted);
      font-size: 0.85em;
    }

    .compare-toolbar button {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 0.85em;
    }

    .compare-toolbar button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .compare-toolbar .cmp-btn-primary {
      background: var(--accent);
      color: #0d1117;
      border-color: var(--accent);
      font-weight: 600;
    }

    .compare-toolbar .cmp-btn-primary:hover {
      opacity: 0.85;
      color: #0d1117;
    }

    .compare-body {
      flex-direction: column;
      width: 100%;
      height: 100%;
      padding: 16px;
    }

    .compare-pair-nav {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      justify-content: center;
      flex-shrink: 0;
    }

    .compare-pair-nav button {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 4px;
      padding: 4px 12px;
      cursor: pointer;
      font-size: 0.8em;
    }

    .compare-pair-nav button.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .compare-widget-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 0;
      width: 100%;
    }

    .compare-widget-wrap img-comparison-slider {
      max-width: 100%;
      max-height: calc(100vh - 180px);
      --divider-color: var(--accent);
      --default-handle-color: var(--accent);
      --divider-width: 2px;
    }

    .compare-widget-wrap img-comparison-slider img {
      max-width: 100%;
      max-height: calc(100vh - 180px);
      object-fit: contain;
    }

    .compare-labels {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-top: 8px;
      font-size: 0.82em;
      color: var(--muted);
    }

    .compare-labels .cmp-label {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 10px;
    }

    .compare-labels .cmp-label .exp {
      /* color set dynamically via expColors */
    }

    /* Compare mode switcher */
    .cmp-mode-bar {
      display: flex;
      gap: 4px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px;
    }

    .cmp-mode-bar button {
      background: none;
      border: none;
      color: var(--muted);
      border-radius: 4px;
      padding: 4px 12px;
      cursor: pointer;
      font-size: 0.82em;
    }

    .cmp-mode-bar button.active {
      background: var(--accent);
      color: #0d1117;
    }

    /* Toggle mode */
    .cmp-toggle-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      flex: 1;
      min-height: 0;
    }

    .cmp-toggle-wrap img {
      max-width: 100%;
      max-height: calc(100vh - 180px);
      object-fit: contain;
    }

    .cmp-toggle-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2em;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.7;
      transition: opacity 0.15s;
      z-index: 2;
    }

    .cmp-toggle-arrow:hover {
      opacity: 1;
      border-color: var(--accent);
      color: var(--accent);
    }

    .cmp-toggle-arrow.left { left: 16px; }
    .cmp-toggle-arrow.right { right: 16px; }

    .cmp-toggle-indicator {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2px 14px;
      font-size: 0.78em;
      color: var(--muted);
      z-index: 2;
    }

    /* Magnifier mode */
    .cmp-mag-wrap {
      display: flex;
      gap: 16px;
      width: 100%;
      flex: 1;
      min-height: 0;
      align-items: center;
      justify-content: center;
    }

    .cmp-mag-cell {
      position: relative;
      flex: 1;
      max-width: 50%;
      overflow: hidden;
      cursor: crosshair;
    }

    .cmp-mag-cell img {
      width: 100%;
      max-height: calc(100vh - 180px);
      object-fit: contain;
      display: block;
    }

    .cmp-mag-lens {
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      pointer-events: none;
      display: none;
      background-repeat: no-repeat;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 4px 16px rgba(0,0,0,0.5);
      z-index: 5;
    }

    /* Text entries */
    .text-entry {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: hidden;
      position: relative;
    }

    .text-entry .label {
      padding: 8px 12px;
      font-size: 0.8em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    .text-entry pre {
      padding: 12px;
      white-space: pre-wrap;
      font-size: 0.85em;
      font-family: 'SF Mono', Menlo, monospace;
      color: var(--text);
      user-select: text;
      cursor: text;
    }

    .text-entry .copy-btn {
      position: absolute;
      top: 8px;
      right: 40px;
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      width: 28px;
      height: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 2;
    }

    .text-entry:hover .copy-btn {
      opacity: 1;
    }

    .text-entry .copy-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    /* Text slider */
    .txt-slider-viewport {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .txt-slider-cell {
      position: relative;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .txt-slider-cell .cell-label {
      padding: 6px 12px;
      font-size: 0.78em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    .txt-slider-cell pre {
      padding: 12px;
      white-space: pre-wrap;
      font-size: 0.85em;
      font-family: 'SF Mono', Menlo, monospace;
      color: var(--text);
      user-select: text;
      cursor: text;
      margin: 0;
    }

    .txt-slider-cell .copy-btn {
      position: absolute;
      top: 6px;
      right: 8px;
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      width: 26px;
      height: 26px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 2;
    }

    .txt-slider-cell:hover .copy-btn { opacity: 1; }
    .txt-slider-cell .copy-btn:hover { color: var(--accent); border-color: var(--accent); }

    /* Tables */
    .artifacts-table {
      width: 100%;
      border-collapse: collapse;
    }

    .artifacts-table th,
    .artifacts-table td {
      padding: 8px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 0.85em;
    }

    .artifacts-table th {
      color: var(--accent);
    }

    .artifacts-table a {
      color: var(--accent);
      text-decoration: none;
    }

    .artifacts-table a:hover {
      text-decoration: underline;
    }

    /* Settings */
    .settings-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      max-width: 480px;
    }

    .settings-card h2 {
      font-size: 1em;
      color: var(--accent);
      margin-bottom: 16px;
    }

    .settings-row {
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .settings-row label {
      font-size: 0.85em;
      color: var(--muted);
      min-width: 140px;
    }

    .settings-row select,
    .settings-row input[type=number] {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.85em;
    }

    .empty-msg {
      color: #484f58;
      font-style: italic;
      padding: 40px;
      text-align: center;
    }

    /* Expand button */
    .expand-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      width: 28px;
      height: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 2;
    }

    .card:hover .expand-btn,
    .media-card:hover .expand-btn,
    .text-entry:hover .expand-btn {
      opacity: 1;
    }

    .expand-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    /* Drag-and-drop reordering */
    .draggable {
      cursor: grab;
    }

    .draggable.dragging {
      opacity: 0.4;
      cursor: grabbing;
    }

    .drag-over {
      outline: 2px dashed var(--accent);
      outline-offset: -2px;
    }

    /* Fullscreen overlay */
    .fs-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      overflow: auto;
    }

    .fs-overlay .fs-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .fs-overlay .fs-header h2 {
      font-size: 1em;
      color: var(--muted);
      margin: 0;
    }

    .fs-overlay .fs-header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .fs-overlay .fs-close {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 4px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 0.85em;
    }

    .fs-overlay .fs-close:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .fs-overlay .fs-body {
      flex: 1;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fs-overlay .fs-body canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .fs-overlay .fs-body img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .fs-img-body {
      overflow: auto;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 0;
    }

    .fs-img-zoom {
      width: 100%;
      height: auto;
      display: block;
    }

    .fs-zoom-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 4px;
      width: 32px;
      height: 32px;
      cursor: pointer;
      font-size: 1.2em;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fs-zoom-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .fs-overlay .fs-body video {
      max-width: 100%;
      max-height: 100%;
    }

    .fs-overlay .fs-body pre {
      width: 100%;
      max-height: 100%;
      overflow: auto;
      font-family: 'SF Mono', Menlo, monospace;
      font-size: 0.9em;
      white-space: pre-wrap;
      color: var(--text);
      padding: 20px;
      user-select: text;
      cursor: text;
    }
  </style>
</head>

<body>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;">
    <h1 style="margin:0;position:relative;">
      <span id="project-name">vibetrack</span>
      <div id="project-menu"></div>
    </h1>
    <span id="delete-project-btn" style="display:none;color:var(--muted);cursor:pointer;line-height:0;" title="Delete project"></span>
  </div>

  <div class="tabs" id="main-tabs"></div>

  <!-- Scalars -->
  <div class="tab-content" id="tab-scalars">
    <div class="controls">
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:0.85em;color:var(--muted);">Experiments</span>
        <div class="exp-pills" id="exp-pills"></div>
      </div>
    </div>
    <div class="grid" id="charts"></div>
  </div>

  <!-- Images -->
  <div class="tab-content" id="tab-images">
    <div id="images-container"></div>
  </div>

  <!-- Audio -->
  <div class="tab-content" id="tab-audio">
    <div id="audio-list"></div>
  </div>

  <!-- Video -->
  <div class="tab-content" id="tab-video">
    <div class="media-grid" id="video-grid"></div>
  </div>

  <!-- Artifacts -->
  <div class="tab-content" id="tab-artifacts">
    <table class="artifacts-table" id="artifacts-table">
      <thead>
        <tr>
          <th>Experiment</th>
          <th>Tag</th>
          <th>Step</th>
          <th>Filename</th>
          <th>Size</th>
          <th>Type</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="artifacts-body"></tbody>
    </table>
  </div>

  <!-- Text -->
  <div class="tab-content" id="tab-text">
    <div id="text-list"></div>
  </div>

  <!-- Histograms -->
  <div class="tab-content" id="tab-histograms">
    <div class="grid" id="histogram-charts"></div>
  </div>

  <!-- System -->
  <div class="tab-content" id="tab-system">
    <div class="grid" id="system-charts"></div>
  </div>

  <!-- Settings -->
  <div class="tab-content" id="tab-settings">
    <div class="settings-card" id="project-info-card" style="display:none;">
      <h2>Project Info</h2>
      <div id="project-info-content"></div>
    </div>
    <div class="settings-card">
      <h2>Look &amp; Feel</h2>
      <div class="settings-row">
        <label>Theme</label>
        <select id="cfg-theme">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
          <option value="orange">Orange</option>
        </select>
      </div>
      <div class="settings-row">
        <label>Auto-refresh (sec)</label>
        <input type="number" id="cfg-refresh" value="0" min="0" step="5" style="width:80px;">
      </div>
      <div class="settings-row">
        <label>Image play FPS</label>
        <select id="cfg-image-fps">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="4">4</option>
          <option value="8">8</option>
          <option value="12">12</option>
          <option value="24">24</option>
        </select>
      </div>
    </div>
    <div class="settings-card">
      <h2>Smoothing</h2>
      <div class="settings-row">
        <label>Method</label>
        <select id="cfg-smoothing">
          <option value="ema">EMA</option>
          <option value="moving_average">Simple moving average</option>
          <option value="gaussian">Gaussian</option>
        </select>
      </div>
      <div class="settings-row">
        <label>Weight</label>
        <input type="range" id="cfg-smooth-weight" min="0" max="0.99" step="0.01" value="0">
        <span class="smooth-val" id="cfg-smooth-weight-val">0</span>
      </div>
    </div>
    <div class="settings-card">
      <h2>System metrics</h2>
      <div class="settings-row">
        <label>Collect interval</label>
        <select id="cfg-sys-interval">
          <option value="none">None</option>
          <option value="once">Once (before run)</option>
          <option value="60">Every minute</option>
          <option value="600">Every 10 minutes</option>
          <option value="3600">Every hour</option>
          <option value="86400">Daily</option>
        </select>
      </div>
    </div>
  </div>

  <script>
    const DATA = __DATA_JSON__;
    const COLORS = ['#58a6ff', '#f78166', '#3fb950', '#d2a8ff', '#f0883e', '#79c0ff', '#56d364', '#e3b341', '#ff7b72', '#a5d6ff'];
    const _delIcon = `<svg width="11" height="13" viewBox="0 0 11 13" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M1 3h9"/><path d="M3.5 3V2a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1"/><path d="M2 3l.5 8a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1L9 3"/><path d="M4.5 5.5v4"/><path d="M6.5 5.5v4"/></svg>`;
    const _delIconLg = `<svg width="15" height="17" viewBox="0 0 11 13" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M1 3h9"/><path d="M3.5 3V2a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1"/><path d="M2 3l.5 8a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1L9 3"/><path d="M4.5 5.5v4"/><path d="M6.5 5.5v4"/></svg>`;

    function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function mediaUrl(p) { return '/media?path=' + encodeURIComponent(p); }
    function emaSmooth(vals, w) { if (!vals.length) return []; let n = 0, d = 0; return vals.map(v => { n = w * n + (1 - w) * v; d = w * d + (1 - w); return n / d; }); }
    function emaSmoothXY(steps, vals, w) {
      if (!vals.length) return [];
      const out = [];
      let n = 0, d = 0;
      for (let i = 0; i < vals.length; i++) {
        const v = vals[i];
        if (v === null || v === undefined || (typeof v === 'number' && isNaN(v))) {
          out.push({ x: steps[i], y: null }); continue;
        }
        n = w * n + (1 - w) * v; d = w * d + (1 - w);
        out.push({ x: steps[i], y: n / d });
      }
      return out;
    }
    function humanSize(b) { if (!b) return ''; const u = ['B', 'KB', 'MB', 'GB']; let i = 0; while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; } return b.toFixed(i ? 1 : 0) + ' ' + u[i]; }
    function formatVal(v) {
      if (v === null || v === undefined || (typeof v === 'number' && isNaN(v))) return 'NaN';
      if (v === 0) return '0';
      const abs = Math.abs(v);
      if (abs >= 1e6 || (abs > 0 && abs < 1e-4)) return v.toExponential(3);
      if (abs >= 1000) return v.toFixed(0);
      if (abs >= 1) return parseFloat(v.toPrecision(5)).toString();
      return parseFloat(v.toPrecision(4)).toString();
    }

    function saveDragOrder(container, key) {
      const ids = [...container.children].map(el => el.dataset.dragId).filter(Boolean);
      try { localStorage.setItem('vt_order_' + key, JSON.stringify(ids)); } catch (e) {}
    }

    function restoreDragOrder(container, key) {
      try {
        const saved = JSON.parse(localStorage.getItem('vt_order_' + key));
        if (!Array.isArray(saved) || !saved.length) return;
        const byId = new Map();
        [...container.children].forEach(el => { if (el.dataset.dragId) byId.set(el.dataset.dragId, el); });
        saved.forEach(id => { const el = byId.get(id); if (el) { container.appendChild(el); byId.delete(id); } });
        byId.forEach(el => container.appendChild(el));
      } catch (e) {}
    }

    function enableDragSort(container, storageKey) {
      if (!container || !container.children.length) return;
      if (storageKey) restoreDragOrder(container, storageKey);
      [...container.children].forEach(el => { el.draggable = true; el.classList.add('draggable'); });
      if (container._dragSortEnabled) return;
      container._dragSortEnabled = true;
      container._dragSortKey = storageKey;
      let dragEl = null;
      container.addEventListener('dragstart', e => {
        dragEl = e.target.closest('[draggable]');
        if (dragEl) { dragEl.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; }
      });
      container.addEventListener('dragend', () => {
        if (dragEl) dragEl.classList.remove('dragging');
        container.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over'));
        dragEl = null;
      });
      container.addEventListener('dragover', e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        container.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over'));
        const target = e.target.closest('[draggable]');
        if (target && target !== dragEl && target.parentNode === container) target.classList.add('drag-over');
      });
      container.addEventListener('drop', e => {
        e.preventDefault();
        container.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over'));
        const target = e.target.closest('[draggable]');
        if (!dragEl || !target || target === dragEl || target.parentNode !== container) return;
        const children = [...container.children];
        if (children.indexOf(dragEl) < children.indexOf(target)) target.after(dragEl);
        else target.before(dragEl);
        if (container._dragSortKey) saveDragOrder(container, container._dragSortKey);
      });
    }

    // ── Resolve CSS var colors for Chart.js ──────────────────────
    function themeColors() {
      const s = getComputedStyle(document.body);
      return {
        muted: s.getPropertyValue('--muted').trim(),
        text: s.getPropertyValue('--text').trim(),
        grid: s.getPropertyValue('--grid').trim(),
      };
    }

    // ── Fullscreen overlay ───────────────────────────────────────
    function openFullscreen(title, buildFn) {
      const ov = document.createElement('div'); ov.className = 'fs-overlay';
      ov.innerHTML = `<div class="fs-header"><h2></h2><div class="fs-header-right"><button class="fs-close">Close · Esc</button></div></div><div class="fs-body"></div>`;
      ov.querySelector('.fs-header h2').textContent = title;
      document.body.appendChild(ov);
      const body = ov.querySelector('.fs-body');
      buildFn(body, ov);
      const close = () => { ov.remove(); };
      ov.querySelector('.fs-close').addEventListener('click', close);
      const onKey = e => { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onKey); } };
      document.addEventListener('keydown', onKey);
    }

    function openVideoFullscreen(title, src) {
      const ov = document.createElement('div'); ov.className = 'fs-overlay';
      ov.innerHTML = `<div class="fs-header"><h2></h2><div class="fs-header-right"><button class="fs-close">Close · Esc</button></div></div><div class="fs-body"></div>`;
      ov.querySelector('.fs-header h2').textContent = title;
      const body = ov.querySelector('.fs-body');
      const vid = document.createElement('video');
      vid.controls = true; vid.autoplay = true; vid.src = src;
      body.appendChild(vid);
      document.body.appendChild(ov);
      const close = () => { vid.pause(); ov.remove(); };
      ov.querySelector('.fs-close').addEventListener('click', close);
      const onKey = e => { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onKey); } };
      document.addEventListener('keydown', onKey);
    }

    function openImageGalleryFullscreen(title, entries) {
      const steps = _imgUniqueSteps(entries);
      if (!steps.length) return;
      const byExp = {};
      entries.forEach(e => { if (!byExp[e.exp]) byExp[e.exp] = {}; byExp[e.exp][e.step] = e.path; });
      const expNames = Object.keys(byExp);

      const ov = document.createElement('div'); ov.className = 'fs-overlay';
      const _zoomOut = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="6" cy="6" r="4"/><line x1="9" y1="9" x2="13" y2="13"/><line x1="4" y1="6" x2="8" y2="6"/></svg>`;
      const _zoomIn = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="6" cy="6" r="4"/><line x1="9" y1="9" x2="13" y2="13"/><line x1="6" y1="4" x2="6" y2="8"/><line x1="4" y1="6" x2="8" y2="6"/></svg>`;
      ov.innerHTML = `<div class="fs-header"><h2></h2><div style="display:flex;gap:8px;align-items:center;"><button class="fs-zoom-btn" data-delta="-20" title="Zoom out">${_zoomOut}</button><button class="fs-zoom-btn" data-delta="20" title="Zoom in">${_zoomIn}</button><button class="fs-close">Close · Esc</button></div></div><div class="fs-anim-bar" style="display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--bg2);border-bottom:1px solid var(--border);"><button class="fs-play-btn">&#9654;</button><input type="range" class="fs-step-slider" min="0" max="${steps.length - 1}" value="0" style="flex:1;accent-color:var(--accent);"><span class="fs-step-label" style="font-size:0.85em;color:var(--muted);white-space:nowrap;"></span></div><div class="fs-body fs-img-body" style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center;overflow-y:auto;"></div>`;
      ov.querySelector('.fs-header h2').textContent = title;
      const body = ov.querySelector('.fs-body');
      const slider = ov.querySelector('.fs-step-slider');
      const stepLabel = ov.querySelector('.fs-step-label');
      const playBtn = ov.querySelector('.fs-play-btn');

      let zoom = 80;
      const imgs = {};
      expNames.forEach(exp => {
        const cell = document.createElement('div');
        cell.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:4px;';
        const img = document.createElement('img'); img.className = 'fs-img-zoom'; img.style.width = zoom + '%';
        const lbl = document.createElement('div'); lbl.textContent = exp;
        lbl.style.cssText = 'font-size:0.8em;color:' + (expColors[exp] || 'var(--muted)') + ';';
        cell.append(img, lbl); body.appendChild(cell); imgs[exp] = img;
      });

      ov.querySelectorAll('.fs-zoom-btn').forEach(btn => btn.addEventListener('click', () => {
        zoom = Math.min(Math.max(zoom + parseInt(btn.dataset.delta), 20), 400);
        Object.values(imgs).forEach(i => i.style.width = zoom + '%');
      }));

      function renderFrame(idx) {
        const step = steps[idx];
        stepLabel.textContent = 'Step ' + step + ' / ' + steps[steps.length - 1];
        slider.value = idx;
        expNames.forEach(exp => {
          const path = byExp[exp][step];
          imgs[exp].style.display = path ? '' : 'none';
          if (path) imgs[exp].src = mediaUrl(path);
        });
      }

      let playing = false, timer = null;
      function stopAnim() { playing = false; playBtn.innerHTML = '&#9654;'; if (timer) { clearInterval(timer); timer = null; } }
      function startAnim() {
        playing = true; playBtn.innerHTML = '&#9646;&#9646;';
        const fps = parseInt((document.getElementById('cfg-image-fps') || {}).value) || 4;
        timer = setInterval(() => { let i = parseInt(slider.value) + 1; if (i >= steps.length) i = 0; renderFrame(i); }, 1000 / fps);
      }
      playBtn.addEventListener('click', () => { if (playing) stopAnim(); else startAnim(); });
      slider.addEventListener('input', () => { stopAnim(); renderFrame(parseInt(slider.value)); });
      renderFrame(0);
      document.body.appendChild(ov);
      const close = () => { stopAnim(); ov.remove(); document.removeEventListener('keydown', onKey); };
      ov.querySelector('.fs-close').addEventListener('click', close);
      const onKey = e => { if (e.key === 'Escape') close(); };
      document.addEventListener('keydown', onKey);
    }

    function openImageFullscreen(title, src) {
      const ov = document.createElement('div'); ov.className = 'fs-overlay';
      const zoomOut = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="6" cy="6" r="4"/><line x1="9" y1="9" x2="13" y2="13"/><line x1="4" y1="6" x2="8" y2="6"/></svg>`;
      const zoomIn = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="6" cy="6" r="4"/><line x1="9" y1="9" x2="13" y2="13"/><line x1="6" y1="4" x2="6" y2="8"/><line x1="4" y1="6" x2="8" y2="6"/></svg>`;
      ov.innerHTML = `<div class="fs-header"><h2></h2><div style="display:flex;gap:8px;align-items:center;"><button class="fs-zoom-btn" data-delta="-20" title="Zoom out">${zoomOut}</button><button class="fs-zoom-btn" data-delta="20" title="Zoom in">${zoomIn}</button><button class="fs-close">Close · Esc</button></div></div><div class="fs-body fs-img-body"></div>`;
      ov.querySelector('.fs-header h2').textContent = title;
      const body = ov.querySelector('.fs-body');
      const img = document.createElement('img'); img.src = src; img.className = 'fs-img-zoom';
      body.appendChild(img);
      document.body.appendChild(ov);
      let zoom = 100;
      ov.querySelectorAll('.fs-zoom-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          zoom = Math.min(Math.max(zoom + parseInt(btn.dataset.delta), 20), 400);
          img.style.width = zoom + '%';
        });
      });
      const close = () => { ov.remove(); };
      ov.querySelector('.fs-close').addEventListener('click', close);
      const onKey = e => { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onKey); } };
      document.addEventListener('keydown', onKey);
    }

    function addExpandBtn(parent, title, buildFn) {
      const btn = document.createElement('button'); btn.className = 'expand-btn'; btn.innerHTML = '⛶'; btn.title = 'Fullscreen';
      btn.addEventListener('click', e => { e.stopPropagation(); openFullscreen(title, buildFn); });
      parent.appendChild(btn);
    }

    // ── Tab management ───────────────────────────────────────────
    let _activeTab = null;
    function switchTab(id) {
      document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      const btn = document.querySelector(`.tabs button[data-tab="${id}"]`);
      if (btn) btn.classList.add('active');
      document.getElementById('tab-' + id).classList.add('active');
      if (_activeTab === 'images' && id !== 'images') _imgClearSelection();
      _activeTab = id;
    }

    function buildTabs() {
      const el = document.getElementById('main-tabs');
      // Remember currently active tab
      const prev = _activeTab || (el.querySelector('button.active') || {}).dataset?.tab;
      el.innerHTML = '';
      const defs = [
        { id: 'scalars', label: 'Scalars', has: DATA.some(d => (d.tags || []).length > 0) },
        { id: 'images', label: 'Images', has: DATA.some(d => (d.image_tags || []).length > 0) },
        { id: 'audio', label: 'Audio', has: DATA.some(d => (d.audio_tags || []).length > 0) },
        { id: 'video', label: 'Video', has: DATA.some(d => (d.video_tags || []).length > 0) },
        { id: 'artifacts', label: 'Artifacts', has: DATA.some(d => (d.artifact_tags || []).length > 0) },
        { id: 'text', label: 'Text', has: DATA.some(d => (d.text_tags || []).length > 0) },
        { id: 'histograms', label: 'Histograms', has: DATA.some(d => (d.histogram_tags || []).length > 0) },
        { id: 'system', label: 'System', has: DATA.some(d => (d.system_tags || []).length > 0) },
        { id: 'settings', label: 'Settings', has: true },
      ];
      const available = defs.filter(d => d.has);
      available.forEach(d => {
        const btn = document.createElement('button');
        btn.dataset.tab = d.id; btn.textContent = d.label;
        btn.addEventListener('click', () => switchTab(d.id));
        el.appendChild(btn);
      });
      // Restore previous tab if still available, otherwise pick first
      const target = available.find(d => d.id === prev) ? prev : (available[0] || {}).id;
      if (target) switchTab(target);
    }

    // ── Experiment pills ─────────────────────────────────────────
    const expNames = DATA.map(d => d.name);
    const activePills = new Set(expNames);
    const _colorKey = 'vt_colors_' + (window.VT_PROJECT || '');
    const _savedColors = (() => { try { return JSON.parse(localStorage.getItem(_colorKey)) || {}; } catch { return {}; } })();
    const expColors = Object.fromEntries(expNames.map((n, i) => [n, _savedColors[n] || COLORS[i % COLORS.length]]));
    function _saveColors() { try { localStorage.setItem(_colorKey, JSON.stringify(expColors)); } catch {} }

    function buildPills() {
      const c = document.getElementById('exp-pills'); c.innerHTML = '';
      expNames.forEach((name, idx) => {
        const color = expColors[name];
        const pill = document.createElement('div');
        pill.className = 'exp-pill active'; pill.dataset.name = name;
        const ci = document.createElement('input'); ci.type = 'color'; ci.value = color;
        ci.style.cssText = 'position:absolute;width:0;height:0;opacity:0;pointer-events:none;';
        ci.addEventListener('input', e => { expColors[name] = e.target.value; _saveColors(); pill.querySelector('.dot').style.background = e.target.value; buildCharts(); });
        const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = color; dot.title = 'Change color';
        dot.addEventListener('click', e => { e.stopPropagation(); ci.click(); });
        const nameSpan = document.createElement('span'); nameSpan.className = 'exp-name'; nameSpan.textContent = name;
        const renameBtn = document.createElement('span'); renameBtn.className = 'rename-btn'; renameBtn.title = 'Rename'; renameBtn.textContent = '\u270E';
        renameBtn.addEventListener('click', e => {
          e.stopPropagation();
          startRename(pill, nameSpan, name, idx);
        });
        const deleteBtn = document.createElement('span'); deleteBtn.className = 'delete-btn'; deleteBtn.title = 'Delete'; deleteBtn.innerHTML = _delIcon;
        deleteBtn.addEventListener('click', e => {
          e.stopPropagation();
          if (!confirm('Delete experiment "' + name + '"? This cannot be undone.')) return;
          fetch('/api/experiment', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name }),
          })
          .then(r => r.json())
          .then(res => { if (res.ok) window.location.reload(); else alert('Delete failed: ' + (res.error || 'unknown')); })
          .catch(() => alert('Delete failed'));
        });
        pill.append(ci, dot, nameSpan, renameBtn, deleteBtn);
        pill.addEventListener('click', () => {
          if (activePills.has(name)) { activePills.delete(name); pill.classList.remove('active'); }
          else { activePills.add(name); pill.classList.add('active'); }
          buildCharts();
        });
        c.appendChild(pill);
      });
    }

    function startRename(pill, nameSpan, oldName, idx) {
      const input = document.createElement('input'); input.className = 'exp-rename-input';
      input.value = oldName;
      nameSpan.replaceWith(input);
      input.focus(); input.select();
      // Hide rename button while editing
      const renameBtn = pill.querySelector('.rename-btn');
      if (renameBtn) renameBtn.style.display = 'none';

      function commitRename() {
        const newName = input.value.trim();
        if (!newName || newName === oldName) {
          cancelRename();
          return;
        }
        fetch('/api/rename', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ old_name: oldName, new_name: newName }),
        })
        .then(r => r.json())
        .then(res => {
          if (res.ok) {
            window.location.reload();
          } else {
            alert('Rename failed: ' + (res.error || 'unknown error'));
            cancelRename();
          }
        })
        .catch(() => cancelRename());
      }

      function cancelRename() {
        const ns = document.createElement('span'); ns.className = 'exp-name'; ns.textContent = oldName;
        input.replaceWith(ns);
        if (renameBtn) renameBtn.style.display = '';
      }

      input.addEventListener('keydown', e => {
        e.stopPropagation();
        if (e.key === 'Enter') { e.preventDefault(); commitRename(); }
        if (e.key === 'Escape') { e.preventDefault(); cancelRename(); }
      });
      input.addEventListener('click', e => e.stopPropagation());
      input.addEventListener('blur', () => commitRename());
    }

    // ── Chart helpers ────────────────────────────────────────────
    function yTickCallback(v, index, ticks) {
      if (v === null || isNaN(v)) return '';
      const range = this.max - this.min;
      if (range === 0 || ticks.length <= 1) return formatVal(v);
      const step = range / (ticks.length - 1);
      const abs = Math.abs(v);
      if (abs >= 1e6 || (abs > 0 && abs < 1e-4)) return v.toExponential(2);
      const decPlaces = step > 0 ? Math.max(0, -Math.floor(Math.log10(Math.abs(step)))) + 1 : 4;
      return parseFloat(v.toFixed(Math.min(decPlaces, 8))).toString();
    }

    function makeLineChart(ctx, datasets, opts) {
      const o = opts || {};
      const tc = themeColors();
      return new Chart(ctx, {
        type: 'line', data: { datasets },
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          interaction: { mode: 'nearest', axis: 'x', intersect: false },
          scales: {
            x: { type: 'linear', title: { display: true, text: 'step', color: tc.muted }, ticks: { color: tc.muted, maxTicksLimit: o.xTicks || 8, autoSkip: true, stepSize: 1, callback: v => Number.isInteger(v) ? v : null }, grid: { color: tc.grid } },
            y: { beginAtZero: false, ticks: { color: tc.muted, maxTicksLimit: o.yTicks || 7, autoSkip: true, callback: yTickCallback }, grid: { color: tc.grid } },
          },
          plugins: {
            legend: { labels: { color: tc.text, font: { size: 11 }, filter: i => !i.text.startsWith('_') }, onClick: (e, i, l) => { Chart.defaults.plugins.legend.onClick.call(l, e, i, l); } },
            tooltip: {
              mode: 'nearest', axis: 'x', intersect: false,
              animation: { duration: 150 },
              filter: item => !item.dataset.label.startsWith('_'),
              callbacks: {
                title: items => items.length ? 'step ' + items[0].parsed.x : '',
                label: item => {
                  const y = item.parsed.y;
                  if (y === null || y === undefined || isNaN(y)) return item.dataset.label + ': NaN';
                  return item.dataset.label + ': ' + formatVal(y);
                }
              }
            }
          },
        },
      });
    }

    function makeBarChart(ctx, labels, datasets) {
      const tc = themeColors();
      return new Chart(ctx, {
        type: 'bar', data: { labels, datasets },
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          scales: { x: { ticks: { color: tc.muted, maxTicksLimit: 20 }, grid: { color: tc.grid } }, y: { ticks: { color: tc.muted, maxTicksLimit: 7, autoSkip: true, callback: yTickCallback }, grid: { color: tc.grid } } },
          plugins: { legend: { labels: { color: tc.text, font: { size: 11 } } } }
        }
      });
    }

    function buildScalarDatasets(tag, sw) {
      const sel = [...activePills]; const ds = [];
      DATA.forEach(exp => {
        if (!sel.includes(exp.name)) return;
        const s = exp.scalars[tag]; if (!s) return;
        const col = expColors[exp.name];
        const raw = s.steps.map((st, j) => ({ x: st, y: s.values[j] }));
        const pr = raw.length <= 3 ? 4 : 0;

        // Compute global min/max for extrema markers
        const validYs = s.values.filter(v => v !== null && v !== undefined && !isNaN(v));
        const minY = validYs.length >= 3 ? Math.min(...validYs) : null;
        const maxY = validYs.length >= 3 ? Math.max(...validYs) : null;
        const hasExt = minY !== null && maxY !== null && minY !== maxY;
        const extRadius = v => hasExt && (v === minY || v === maxY) ? 5 : pr;
        const extBorder = v => hasExt && (v === minY || v === maxY) ? '#fff8' : 'transparent';
        const extBorderW = v => hasExt && (v === minY || v === maxY) ? 1.5 : 0;

        if (sw > 0) {
          ds.push({
            label: '_raw_' + exp.name, data: raw, borderColor: col + '55', spanGaps: false,
            pointRadius: s.values.map(v => extRadius(v)), pointBackgroundColor: col,
            pointBorderColor: s.values.map(v => extBorder(v)), pointBorderWidth: s.values.map(v => extBorderW(v)),
            borderWidth: 1, tension: 0
          });
          const sm = emaSmoothXY(s.steps, s.values, sw);
          ds.push({ label: exp.name, data: sm, borderColor: col, spanGaps: false, pointRadius: 0, backgroundColor: col, borderWidth: 2, tension: 0 });
        } else {
          ds.push({
            label: exp.name, data: raw, borderColor: col, spanGaps: false,
            pointRadius: s.values.map(v => extRadius(v)), pointBackgroundColor: col,
            pointBorderColor: s.values.map(v => extBorder(v)), pointBorderWidth: s.values.map(v => extBorderW(v)),
            backgroundColor: col, borderWidth: 2, tension: 0
          });
        }
      });
      return ds;
    }

    function buildSystemDatasets(tag, sw) {
      const ds = [];
      DATA.forEach(exp => {
        const s = (exp.system_scalars || {})[tag]; if (!s) return;
        const col = expColors[exp.name];
        const fillCol = col + '33';
        const pr = s.steps.length <= 3 ? 4 : 0;
        if (sw > 0) {
          const sm = emaSmoothXY(s.steps, s.values, sw);
          ds.push({ label: exp.name, data: sm, borderColor: col, spanGaps: false, pointRadius: 0, backgroundColor: fillCol, borderWidth: 2, tension: 0, fill: true });
        } else {
          ds.push({ label: exp.name, data: s.steps.map((st, j) => ({ x: st, y: s.values[j] })), borderColor: col, spanGaps: false, pointRadius: pr, backgroundColor: fillCol, borderWidth: 2, tension: 0, fill: true });
        }
      });
      return ds;
    }

    function buildHistDatasets(tag) {
      const ds = []; let labels = [];
      DATA.forEach((exp, i) => {
        const entries = (exp.histogram_data || {})[tag]; if (!entries || !entries.length) return;
        const last = entries[entries.length - 1];
        if (!labels.length && last.bins.length > 1) labels = last.bins.slice(0, -1).map((b, j) => ((b + last.bins[j + 1]) / 2).toFixed(2));
        ds.push({ label: exp.name, data: last.counts, backgroundColor: COLORS[i % COLORS.length] + '80', borderColor: COLORS[i % COLORS.length], borderWidth: 1 });
      });
      return { labels, datasets: ds };
    }

    // ── Scalars ──────────────────────────────────────────────────
    function getConfigSmooth() { return currentConfig.smooth_weight ?? 0; }

    function buildCharts() {
      const sw = getConfigSmooth();
      const c = document.getElementById('charts'); c.innerHTML = '';
      if (window._charts) window._charts.forEach(x => x.destroy()); window._charts = [];
      const tags = [...new Set(DATA.flatMap(d => d.tags || []))].sort();
      tags.forEach(tag => {
        const card = document.createElement('div'); card.className = 'card';
        card.dataset.dragId = tag;
        card.innerHTML = `<h2>${escapeHtml(tag)}</h2><canvas></canvas>`;
        c.appendChild(card);
        addExpandBtn(card, tag, (body, ov) => {
          const ctrl = document.createElement('label');
          ctrl.style.cssText = 'display:flex;align-items:center;gap:6px;font-size:0.85em;color:var(--muted);';
          ctrl.innerHTML = `Smoothing <input type="range" min="0" max="0.99" step="0.01" value="${sw}" style="width:120px;accent-color:var(--accent);"> <span class="smooth-val">${sw}</span>`;
          ov.querySelector('.fs-header-right').insertBefore(ctrl, ov.querySelector('.fs-close'));
          const cv = document.createElement('canvas');
          body.appendChild(cv);
          const fsTicks = { xTicks: 20, yTicks: 15 };
          let chart = makeLineChart(cv.getContext('2d'), buildScalarDatasets(tag, sw), fsTicks);
          const sl = ctrl.querySelector('input[type=range]'), vl = ctrl.querySelector('.smooth-val');
          sl.addEventListener('input', () => { vl.textContent = sl.value; chart.destroy(); chart = makeLineChart(cv.getContext('2d'), buildScalarDatasets(tag, parseFloat(sl.value)), fsTicks); });
        });
        window._charts.push(makeLineChart(card.querySelector('canvas').getContext('2d'), buildScalarDatasets(tag, sw)));
      });
      if (!tags.length) c.innerHTML = '<div class="empty-msg">No scalars logged.</div>';
      else enableDragSort(c, 'scalars');
    }

    // ── Images ───────────────────────────────────────────────────
    const _imgAnimTimers = {};
    function _imgAnimPlaying() { return Object.values(_imgAnimTimers).some(Boolean); }
    const _imgCompareSelection = []; // { exp, tag, step, path, cellEl }

    function _imgUpdateCompareToolbar() {
      let bar = document.getElementById('compare-toolbar');
      if (_imgCompareSelection.length < 2) {
        if (bar) bar.style.display = 'none';
        return;
      }
      if (!bar) {
        bar = document.createElement('div');
        bar.id = 'compare-toolbar';
        bar.className = 'compare-toolbar';
        document.body.appendChild(bar);
      }
      bar.style.display = '';
      bar.innerHTML = '';
      const lbl = document.createElement('span');
      lbl.textContent = _imgCompareSelection.length + ' images selected';
      const clearBtn = document.createElement('button');
      clearBtn.textContent = 'Clear';
      clearBtn.addEventListener('click', _imgClearSelection);
      const cmpBtn = document.createElement('button');
      cmpBtn.textContent = 'Compare';
      cmpBtn.className = 'cmp-btn-primary';
      cmpBtn.addEventListener('click', _imgOpenCompare);
      bar.append(lbl, clearBtn, cmpBtn);
    }

    function _imgClearSelection() {
      _imgCompareSelection.forEach(s => {
        if (s.cellEl) s.cellEl.classList.remove('img-selected');
        const cb = s.cellEl && s.cellEl.querySelector('.img-select-cb');
        if (cb) cb.checked = false;
      });
      _imgCompareSelection.length = 0;
      _imgUpdateCompareToolbar();
    }

    function _imgToggleSelect(exp, tag, step, path, cellEl, checked) {
      const idx = _imgCompareSelection.findIndex(s => s.cellEl === cellEl);
      if (checked) {
        if (idx === -1 && _imgCompareSelection.length < 6) {
          _imgCompareSelection.push({ exp, tag, step, path, cellEl });
          cellEl.classList.add('img-selected');
        } else if (idx === -1) {
          // At limit
          const cb = cellEl.querySelector('.img-select-cb');
          if (cb) cb.checked = false;
          return;
        }
      } else {
        if (idx !== -1) {
          _imgCompareSelection.splice(idx, 1);
          cellEl.classList.remove('img-selected');
        }
      }
      _imgUpdateCompareToolbar();
    }

    function _imgOpenCompare() {
      const sel = _imgCompareSelection.slice();
      if (sel.length < 2) return;
      const pairs = [];
      for (let i = 0; i < sel.length; i++)
        for (let j = i + 1; j < sel.length; j++)
          pairs.push([sel[i], sel[j]]);

      const ov = document.createElement('div'); ov.className = 'fs-overlay';
      ov.innerHTML = '<div class="fs-header"><h2>Image Comparison</h2><div class="fs-header-right">' +
        '<div class="cmp-mode-bar">' +
        '<button data-mode="slider" class="active">Slider</button>' +
        '<button data-mode="toggle">Toggle</button>' +
        '<button data-mode="magnifier">Magnifier</button></div>' +
        '<button class="fs-close">Close \u00b7 Esc</button></div></div>' +
        '<div class="fs-body compare-body"></div>';
      document.body.appendChild(ov);

      const body = ov.querySelector('.fs-body');
      let activePair = 0;
      let activeMode = 'slider';
      let toggleSide = 0; // 0 = first image, 1 = second

      // Mode switcher
      ov.querySelectorAll('.cmp-mode-bar button').forEach(btn => {
        btn.addEventListener('click', () => {
          ov.querySelectorAll('.cmp-mode-bar button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeMode = btn.dataset.mode;
          toggleSide = 0;
          renderPair(activePair);
        });
      });

      // Pair navigation
      let pairNav = null;
      if (pairs.length > 1) {
        pairNav = document.createElement('div');
        pairNav.className = 'compare-pair-nav';
        pairs.forEach((pair, pi) => {
          const btn = document.createElement('button');
          btn.textContent = _truncExp(pair[0].exp) + ' vs ' + _truncExp(pair[1].exp);
          btn.addEventListener('click', () => { toggleSide = 0; renderPair(pi); });
          pairNav.appendChild(btn);
        });
        body.appendChild(pairNav);
      }

      const widgetWrap = document.createElement('div');
      widgetWrap.className = 'compare-widget-wrap';
      body.appendChild(widgetWrap);

      const labels = document.createElement('div');
      labels.className = 'compare-labels';
      body.appendChild(labels);

      function makeLabels(a, b) {
        labels.innerHTML = '';
        const lblA = document.createElement('span'); lblA.className = 'cmp-label';
        lblA.innerHTML = '<span class="exp">' + escapeHtml(a.exp) + '</span> / ' + escapeHtml(a.tag) + ' \u2014 step ' + a.step;
        const lblB = document.createElement('span'); lblB.className = 'cmp-label';
        lblB.innerHTML = '<span class="exp">' + escapeHtml(b.exp) + '</span> / ' + escapeHtml(b.tag) + ' \u2014 step ' + b.step;
        labels.append(lblA, lblB);
      }

      function renderSlider(a, b) {
        widgetWrap.innerHTML = '';
        const slider = document.createElement('img-comparison-slider');
        const imgA = document.createElement('img'); imgA.slot = 'first'; imgA.src = mediaUrl(a.path);
        const imgB = document.createElement('img'); imgB.slot = 'second'; imgB.src = mediaUrl(b.path);
        slider.append(imgA, imgB);
        widgetWrap.appendChild(slider);
        makeLabels(a, b);
      }

      function renderToggle(a, b) {
        widgetWrap.innerHTML = '';
        const wrap = document.createElement('div'); wrap.className = 'cmp-toggle-wrap';
        const img = document.createElement('img');
        const cur = toggleSide === 0 ? a : b;
        img.src = mediaUrl(cur.path);
        const indicator = document.createElement('div'); indicator.className = 'cmp-toggle-indicator';
        indicator.textContent = (toggleSide + 1) + ' / 2';
        const leftArr = document.createElement('button'); leftArr.className = 'cmp-toggle-arrow left'; leftArr.innerHTML = '&#9664;';
        const rightArr = document.createElement('button'); rightArr.className = 'cmp-toggle-arrow right'; rightArr.innerHTML = '&#9654;';
        leftArr.style.visibility = toggleSide === 0 ? 'hidden' : '';
        rightArr.style.visibility = toggleSide === 1 ? 'hidden' : '';
        leftArr.addEventListener('click', () => { if (toggleSide > 0) { toggleSide = 0; renderToggle(a, b); } });
        rightArr.addEventListener('click', () => { if (toggleSide < 1) { toggleSide = 1; renderToggle(a, b); } });
        wrap.append(indicator, leftArr, img, rightArr);
        widgetWrap.appendChild(wrap);
        // Highlight active label
        labels.innerHTML = '';
        const lblA = document.createElement('span'); lblA.className = 'cmp-label';
        lblA.style.opacity = toggleSide === 0 ? '1' : '0.4';
        lblA.innerHTML = '<span class="exp">' + escapeHtml(a.exp) + '</span> / ' + escapeHtml(a.tag) + ' \u2014 step ' + a.step;
        const lblB = document.createElement('span'); lblB.className = 'cmp-label';
        lblB.style.opacity = toggleSide === 1 ? '1' : '0.4';
        lblB.innerHTML = '<span class="exp">' + escapeHtml(b.exp) + '</span> / ' + escapeHtml(b.tag) + ' \u2014 step ' + b.step;
        labels.append(lblA, lblB);
      }

      function renderMagnifier(a, b) {
        widgetWrap.innerHTML = '';
        const wrap = document.createElement('div'); wrap.className = 'cmp-mag-wrap';
        const zoom = 3;
        const cells = [a, b].map(item => {
          const cell = document.createElement('div'); cell.className = 'cmp-mag-cell';
          const img = document.createElement('img'); img.src = mediaUrl(item.path);
          const lens = document.createElement('div'); lens.className = 'cmp-mag-lens';
          cell.append(img, lens);
          wrap.appendChild(cell);
          return { cell, img, lens };
        });
        widgetWrap.appendChild(wrap);

        function syncLens(srcIdx, e) {
          const src = cells[srcIdx];
          const rect = src.img.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const px = x / rect.width;
          const py = y / rect.height;
          cells.forEach(c => {
            const r = c.img.getBoundingClientRect();
            const lx = px * r.width;
            const ly = py * r.height;
            c.lens.style.display = 'block';
            c.lens.style.left = (lx - 80) + 'px';
            c.lens.style.top = (ly - 80) + 'px';
            c.lens.style.backgroundImage = 'url(' + c.img.src + ')';
            c.lens.style.backgroundSize = (r.width * zoom) + 'px ' + (r.height * zoom) + 'px';
            c.lens.style.backgroundPosition = (-lx * zoom + 80) + 'px ' + (-ly * zoom + 80) + 'px';
          });
        }

        function hideLens() { cells.forEach(c => { c.lens.style.display = 'none'; }); }

        cells.forEach((c, i) => {
          c.cell.addEventListener('mousemove', e => syncLens(i, e));
          c.cell.addEventListener('mouseleave', hideLens);
        });
        makeLabels(a, b);
      }

      function renderPair(pi) {
        activePair = pi;
        const [a, b] = pairs[pi];
        if (activeMode === 'slider') renderSlider(a, b);
        else if (activeMode === 'toggle') renderToggle(a, b);
        else if (activeMode === 'magnifier') renderMagnifier(a, b);
        if (pairNav) pairNav.querySelectorAll('button').forEach((btn, i) => btn.classList.toggle('active', i === pi));
      }

      renderPair(0);

      // Keyboard
      const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
      ov.querySelector('.fs-close').addEventListener('click', close);
      const onKey = e => {
        if (e.key === 'Escape') { close(); return; }
        if (activeMode === 'toggle') {
          if (e.key === 'ArrowLeft' && toggleSide > 0) { toggleSide = 0; renderPair(activePair); }
          if (e.key === 'ArrowRight' && toggleSide < 1) { toggleSide = 1; renderPair(activePair); }
        } else if (pairs.length > 1) {
          if (e.key === 'ArrowLeft' && activePair > 0) renderPair(activePair - 1);
          if (e.key === 'ArrowRight' && activePair < pairs.length - 1) renderPair(activePair + 1);
        }
      };
      document.addEventListener('keydown', onKey);
    }

    function _truncExp(name) {
      return name.length > 20 ? name.slice(0, 18) + '\u2026' : name;
    }

    function _imgCollectByTag() {
      // Returns { tag: [ { exp, step, path }, ... ] } sorted by step
      const byTag = {};
      DATA.forEach(exp => (exp.image_tags || []).forEach(tag => {
        if (!byTag[tag]) byTag[tag] = [];
        (exp.images[tag] || []).forEach(img => {
          byTag[tag].push({ exp: exp.name, step: img.step, path: img.path });
        });
      }));
      // Sort each tag's images by step
      Object.values(byTag).forEach(arr => arr.sort((a, b) => a.step - b.step));
      return byTag;
    }

    function _imgUniqueSteps(entries) {
      return [...new Set(entries.map(e => e.step))].sort((a, b) => a - b);
    }

    function _imgBuildAnimate(container, entries, tag) {
      const steps = _imgUniqueSteps(entries);
      if (!steps.length) return;

      // Group by experiment
      const byExp = {};
      entries.forEach(e => {
        if (!byExp[e.exp]) byExp[e.exp] = {};
        byExp[e.exp][e.step] = e.path;
      });
      const expNames = Object.keys(byExp);

      const wrap = document.createElement('div'); wrap.className = 'img-animate';

      // Controls
      const ctrl = document.createElement('div'); ctrl.className = 'img-animate-controls';
      const playBtn = document.createElement('button'); playBtn.innerHTML = '&#9654;'; playBtn.title = 'Play';
      const stepLabel = document.createElement('span'); stepLabel.className = 'step-label';
      const slider = document.createElement('input'); slider.type = 'range';
      slider.min = 0; slider.max = steps.length - 1; slider.value = 0;
      ctrl.append(playBtn, slider, stepLabel);
      wrap.appendChild(ctrl);

      // Viewport
      const viewport = document.createElement('div'); viewport.className = 'img-animate-viewport';
      // Create one cell per experiment
      const cells = {};
      const cellEls = {};
      expNames.forEach(exp => {
        const cell = document.createElement('div'); cell.className = 'animate-cell';
        const img = document.createElement('img'); img.alt = exp;
        const cb = document.createElement('input'); cb.type = 'checkbox'; cb.className = 'img-select-cb';
        cb.addEventListener('click', e => e.stopPropagation());
        cb.addEventListener('change', () => {
          const step = steps[parseInt(slider.value)];
          const path = byExp[exp][step];
          if (path) _imgToggleSelect(exp, tag, step, path, cell, cb.checked);
          else cb.checked = false;
        });
        const lbl = document.createElement('div'); lbl.className = 'cell-label';
        lbl.innerHTML = `<span class="exp" style="color:${expColors[exp] || 'var(--muted)'}">${escapeHtml(exp)}</span>`;
        cell.append(cb, img, lbl);
        viewport.appendChild(cell);
        cells[exp] = img;
        cellEls[exp] = cell;
        img.style.cursor = 'pointer';
        img.addEventListener('click', () => {
          const step = steps[parseInt(slider.value)];
          const path = byExp[exp][step];
          if (path) openImageFullscreen(`${exp} / ${escapeHtml(tag)} — step ${step}`, mediaUrl(path));
        });
      });
      wrap.appendChild(viewport);
      container.appendChild(wrap);

      let playing = false;
      const timerKey = tag;

      function renderFrame(idx) {
        const step = steps[idx];
        stepLabel.textContent = 'Step ' + step + ' / ' + steps[steps.length - 1];
        slider.value = idx;
        expNames.forEach(exp => {
          const path = byExp[exp][step];
          if (path) {
            cells[exp].src = mediaUrl(path);
            cells[exp].style.display = '';
          } else {
            cells[exp].style.display = 'none';
          }
          // Update selection metadata to current step
          const si = _imgCompareSelection.findIndex(s => s.cellEl === cellEls[exp]);
          if (si !== -1) {
            if (path) {
              _imgCompareSelection[si].step = step;
              _imgCompareSelection[si].path = path;
            } else {
              // Image not available at this step, deselect
              _imgCompareSelection.splice(si, 1);
              cellEls[exp].classList.remove('img-selected');
              const cb = cellEls[exp].querySelector('.img-select-cb');
              if (cb) cb.checked = false;
              _imgUpdateCompareToolbar();
            }
          }
        });
      }

      function stopAnim() {
        playing = false;
        playBtn.innerHTML = '&#9654;';
        if (_imgAnimTimers[timerKey]) { clearInterval(_imgAnimTimers[timerKey]); _imgAnimTimers[timerKey] = null; }
      }

      function startAnim() {
        playing = true;
        playBtn.innerHTML = '&#9646;&#9646;';
        const fps = parseInt(document.getElementById('cfg-image-fps').value) || 4;
        _imgAnimTimers[timerKey] = setInterval(() => {
          let idx = parseInt(slider.value) + 1;
          if (idx >= steps.length) idx = 0;
          renderFrame(idx);
        }, 1000 / fps);
      }

      playBtn.addEventListener('click', () => {
        if (playing) stopAnim(); else startAnim();
      });

      slider.addEventListener('input', () => {
        stopAnim();
        renderFrame(parseInt(slider.value));
      });

      // Preload first frame
      renderFrame(0);
    }

    // ── Text ─────────────────────────────────────────────────────
    function _txtBuildSlider(container, entries, tag) {
      const steps = [...new Set(entries.map(e => e.step))].sort((a, b) => a - b);
      if (!steps.length) return;

      const byExp = {};
      entries.forEach(e => { if (!byExp[e.exp]) byExp[e.exp] = {}; byExp[e.exp][e.step] = e.value; });
      const expNames = Object.keys(byExp);

      const wrap = document.createElement('div'); wrap.className = 'img-animate';

      const ctrl = document.createElement('div'); ctrl.className = 'img-animate-controls';
      const stepLabel = document.createElement('span'); stepLabel.className = 'step-label';
      const slider = document.createElement('input'); slider.type = 'range';
      slider.min = 0; slider.max = steps.length - 1; slider.value = 0;
      ctrl.append(slider, stepLabel);
      wrap.appendChild(ctrl);

      const viewport = document.createElement('div'); viewport.className = 'txt-slider-viewport';
      const cells = {};
      expNames.forEach(exp => {
        const cell = document.createElement('div'); cell.className = 'txt-slider-cell';
        const lbl = document.createElement('div'); lbl.className = 'cell-label';
        lbl.innerHTML = `<span class="exp" style="color:${expColors[exp] || 'var(--muted)'}">${escapeHtml(exp)}</span>`;
        const pre = document.createElement('pre');
        const copyBtn = document.createElement('button'); copyBtn.className = 'copy-btn'; copyBtn.title = 'Copy'; copyBtn.textContent = '\u2398';
        copyBtn.addEventListener('click', ev => { ev.stopPropagation(); navigator.clipboard.writeText(pre.textContent).then(() => { copyBtn.textContent = '\u2713'; setTimeout(() => { copyBtn.textContent = '\u2398'; }, 1500); }); });
        cell.append(lbl, pre, copyBtn);
        viewport.appendChild(cell);
        cells[exp] = pre;
      });
      wrap.appendChild(viewport);
      container.appendChild(wrap);

      function renderStep(idx) {
        const step = steps[idx];
        stepLabel.textContent = 'Step ' + step + ' / ' + steps[steps.length - 1];
        slider.value = idx;
        expNames.forEach(exp => {
          const val = byExp[exp][step];
          cells[exp].textContent = val !== undefined ? val : '';
          cells[exp].parentElement.style.display = val !== undefined ? '' : 'none';
        });
      }

      slider.addEventListener('input', () => renderStep(parseInt(slider.value)));
      renderStep(0);

          <div style="background:var(--border);border-radius:4px;height:8px;margin:8px 0;"><div style="background:${barColor};height:100%;border-radius:4px;width:${memPct.toFixed(0)}%;"></div></div>
          <div style="color:var(--muted);font-size:0.85em;">${memPct.toFixed(0)}% used (${memUsed.toFixed(1)}G)</div>`;

        grid.appendChild(card);

      // Disk
      const diskTotal = lastVal('system/disk_total_gb');

      const diskPct = lastVal('system/disk_used_percent');

      if (diskTotal) {
        const barColor = diskPct > 95 ? '#f85149' : diskPct > 85 ? '#e3b341' : '#3fb950';
        const card = document.createElement('div'); card.className = 'card';
        card.innerHTML = `<h2>Disk</h2>
          <div style="font-size:1.6em;font-weight:700;margin:8px 0;">${diskFree.toFixed(1)}G free <span style="color:var(--muted);font-size:0.5em;">/ ${diskTotal.toFixed(0)}G</span></div>
          <div style="background:var(--border);border-radius:4px;height:8px;margin:8px 0;"><div style="background:${barColor};height:100%;border-radius:4px;width:${diskPct.toFixed(0)}%;"></div></div>
          <div style="color:var(--muted);font-size:0.85em;">${diskPct.toFixed(0)}% used (${diskUsed.toFixed(1)}G)</div>`;
        maybeChart(card, 'system/disk_used_percent');
        grid.appendChild(card);
      }

      // GPUs
      let gi = 0;
      while (lastVal(`gpu/${gi}/utilization_percent`) !== null) {
        const util = lastVal(`gpu/${gi}/utilization_percent`);

        const memTotalGpu = lastVal(`gpu/${gi}/memory_total_gb`) || 1;
