        const barColor = util > 90 ? '#f85149' : util > 70 ? '#e3b341' : '#3fb950';
        const gMemPct = (memUsedGpu / memTotalGpu * 100).toFixed(0);
        const memColor = gMemPct > 90 ? '#f85149' : gMemPct > 70 ? '#e3b341' : '#58a6ff';
        const card = document.createElement('div'); card.className = 'card';
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 style="margin:0; font-size:1.15em; display:flex; align-items:center; gap:8px; color:var(--text); letter-spacing:-0.2px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.8"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></svg>
              GPU ${gi}
            </h2>
            <div style="background:var(--border); padding:4px 10px; border-radius:16px; font-size:0.75em; font-weight:700; color:var(--text); display:flex; align-items:center; gap:4px; box-shadow:inset 0 1px 2px rgba(0,0,0,0.1);">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"></path></svg>
              ${temp.toFixed(0)}°C
            </div>
          </div>
          <div style="margin-top:20px; display:flex; flex-direction:column; gap:16px;">
            <div>
              <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;">
                <span style="color:var(--muted); font-size:0.75em; text-transform:uppercase; letter-spacing:0.8px; font-weight:600;">Core Utilization</span>
                <span style="font-size:1.4em; font-weight:800; line-height:1; letter-spacing:-0.5px;">${util.toFixed(0)}<span style="font-size:0.6em; color:var(--muted); margin-left:2px;">%</span></span>
              </div>
              <div style="background:var(--border); border-radius:8px; height:8px; overflow:hidden; box-shadow:inset 0 1px 3px rgba(0,0,0,0.05);">
                <div style="background:${barColor}; height:100%; width:${util}%; border-radius:8px; box-shadow:0 0 10px ${barColor}80; transition:width 0.4s ease-out;"></div>
              </div>
            </div>
            <div>
              <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;">
                <span style="color:var(--muted); font-size:0.75em; text-transform:uppercase; letter-spacing:0.8px; font-weight:600;">Memory Usage</span>
                <span style="font-size:1.1em; font-weight:700; line-height:1; letter-spacing:-0.2px;">${(memUsedGpu*1024).toFixed(0)} <span style="font-size:0.8em; color:var(--muted); font-weight:500;">/ ${(memTotalGpu*1024).toFixed(0)} MiB</span></span>
              </div>
              <div style="background:var(--border); border-radius:8px; height:8px; overflow:hidden; box-shadow:inset 0 1px 3px rgba(0,0,0,0.05);">
                <div style="background:${memColor}; height:100%; width:${gMemPct}%; border-radius:8px; box-shadow:0 0 10px ${memColor}80; transition:width 0.4s ease-out;"></div>
              </div>
            </div>
          </div>`;
        maybeChart(card, `gpu/${gi}/utilization_percent`, `gpu/${gi}/memory_used_gb`);
        grid.appendChild(card);
        gi++;
      }
    }

    // ── Settings ─────────────────────────────────────────────────
    let currentConfig = {};
    function loadSettings() {
      fetch('/api/config').then(r => r.json()).then(cfg => { currentConfig = cfg; applyConfig(cfg); }).catch(() => { });
    }
    function applyConfig(cfg) {
      const w = cfg.web || {};
      document.body.classList.remove('light', 'orange');
      const theme = w.theme || 'light';
      if (theme === 'light' || theme === 'orange') document.body.classList.add(theme);
      document.getElementById('cfg-theme').value = w.theme || 'light';
      document.getElementById('cfg-smoothing').value = cfg.smoothing || 'ema';
      const sw = cfg.smooth_weight ?? 0.6;
      document.getElementById('cfg-smooth-weight').value = sw;
      document.getElementById('cfg-smooth-weight-val').textContent = sw;
      document.getElementById('cfg-refresh').value = w.auto_refresh ?? 5;
      setAutoRefresh(w.auto_refresh ?? 5);
      document.getElementById('cfg-image-fps').value = String(w.image_play_fps || 4);
      const sysInterval = cfg.system_metrics_interval ?? (cfg.check_resources_before_run ? 'once' : 'none');
      document.getElementById('cfg-sys-interval').value = String(sysInterval);
    }
    function saveSettings() {
      const c = Object.assign({}, currentConfig);
      c.smoothing = document.getElementById('cfg-smoothing').value;
      c.smooth_weight = parseFloat(document.getElementById('cfg-smooth-weight').value);
      c.web = c.web || {}; c.web.theme = document.getElementById('cfg-theme').value;
      c.web.auto_refresh = parseInt(document.getElementById('cfg-refresh').value) || 0;
      c.web.image_play_fps = parseInt(document.getElementById('cfg-image-fps').value) || 4;
      const iv = document.getElementById('cfg-sys-interval').value;
      c.system_metrics_interval = iv === 'none' ? null : isNaN(iv) ? iv : parseInt(iv);
      delete c.check_resources_before_run;
      currentConfig = c;
      fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(c) });
      applyConfig(c); buildCharts(); buildSystem();
    }
    let refreshTimer = null;
    function setAutoRefresh(s) { if (refreshTimer) clearInterval(refreshTimer); if (s > 0) refreshTimer = setInterval(() => { fetch('/api/data').then(r => r.json()).then(d => { const sx = window.scrollX, sy = window.scrollY; DATA.length = 0; DATA.push(...d); buildTabs(); buildPills(); buildCharts(); buildSystem(); if (!_imgAnimPlaying()) { buildImages(); buildAudio(); buildVideo(); buildArtifacts(); buildText(); buildHistograms(); } window.scrollTo(sx, sy); }); }, s * 1000); }

    document.getElementById('cfg-smoothing').addEventListener('change', saveSettings);
    document.getElementById('cfg-smooth-weight').addEventListener('input', () => { document.getElementById('cfg-smooth-weight-val').textContent = document.getElementById('cfg-smooth-weight').value; saveSettings(); });
    document.getElementById('cfg-theme').addEventListener('change', saveSettings);
    document.getElementById('cfg-refresh').addEventListener('change', saveSettings);
    document.getElementById('cfg-image-fps').addEventListener('change', saveSettings);
    document.getElementById('cfg-sys-interval').addEventListener('change', saveSettings);

    // ── Project Info ────────────────────────────────────────────
    (function buildProjectInfo() {
      // Show parent (project) directories, not individual timestamped run dirs
      const parentDirs = [...new Set(DATA.map(e => {
        const d = e.log_dir; if (!d) return null;
        const sep = d.includes('/') ? '/' : '\\';
        return d.substring(0, d.lastIndexOf(sep));
      }).filter(Boolean))];
      if (!parentDirs.length) return;
      const card = document.getElementById('project-info-card');
      const content = document.getElementById('project-info-content');
      card.style.display = '';
      parentDirs.forEach(d => {
        const row = document.createElement('div');
        row.className = 'settings-row';
        row.innerHTML = `<label style="min-width:auto;flex:none;">Log directory</label>`;
        const input = document.createElement('input');
        input.type = 'text'; input.value = d;
        input.style.cssText = 'flex:1;font-size:0.82em;font-family:monospace;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 8px;';
        input.dataset.original = d;
        input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); if (e.key === 'Escape') { input.value = input.dataset.original; input.blur(); } });
        input.addEventListener('blur', () => {
          const newDir = input.value.trim();
          const oldDir = input.dataset.original;
          if (!newDir || newDir === oldDir) { input.value = oldDir; return; }
          if (!confirm('Move log directory?\n\nFrom: ' + oldDir + '\nTo: ' + newDir)) { input.value = oldDir; return; }
          input.disabled = true;
          fetch('/api/move-logdir', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ old: oldDir, new: newDir }),
          })
          .then(r => r.json())
          .then(res => {
            input.disabled = false;
            if (res.ok) {
              input.dataset.original = newDir;
              // Update all run log_dirs that live under the moved parent
              DATA.forEach(e => {
                if (e.log_dir && (e.log_dir === oldDir || e.log_dir.startsWith(oldDir + '/') || e.log_dir.startsWith(oldDir + '\\'))) {
                  e.log_dir = newDir + e.log_dir.substring(oldDir.length);
                }
              });
            } else { alert('Move failed: ' + (res.error || 'unknown')); input.value = oldDir; }
          })
          .catch(() => { input.disabled = false; alert('Move failed'); input.value = oldDir; });
        });
        row.appendChild(input);
        content.appendChild(row);
      });
    })();

    // ── Init ─────────────────────────────────────────────────────
    function buildAll() {
      buildCharts();
      buildImages(); buildAudio(); buildVideo(); buildArtifacts();
      buildText(); buildHistograms(); buildSystem();
    }

    // ── Project switcher ────────────────────────────────────────
    if (window.VT_PROJECT) localStorage.setItem('vt_last_project', window.VT_PROJECT);
    if (window.VT_PROJECTS && window.VT_PROJECTS.length > 0) {
      const projName = document.getElementById('project-name');
      projName.textContent = VT_PROJECT;
      projName.classList.add('has-menu');
      const menu = document.getElementById('project-menu');
      VT_PROJECTS.forEach(p => {
        const a = document.createElement('a');
        a.href = '/' + p; a.textContent = p;
        if (p === VT_PROJECT) a.classList.add('active');
        menu.appendChild(a);
      });
      projName.addEventListener('click', e => { e.stopPropagation(); menu.classList.toggle('open'); });
      document.addEventListener('click', () => menu.classList.remove('open'));
      menu.addEventListener('click', e => e.stopPropagation());
      const delBtn = document.getElementById('delete-project-btn');
      delBtn.style.display = '';
      delBtn.innerHTML = _delIconLg;
      delBtn.addEventListener('click', () => {
        if (!confirm('Delete project "' + VT_PROJECT + '" and all its data? This cannot be undone.')) return;
        fetch('/api/project/' + VT_PROJECT, { method: 'DELETE' })
          .then(r => r.json())
          .then(res => { if (res.ok) { localStorage.removeItem('vt_last_project'); window.location = '/'; } else alert('Delete failed: ' + (res.error || 'unknown')); })
          .catch(() => alert('Delete failed'));
      });
    }

    buildTabs(); buildPills(); buildAll(); setAutoRefresh(5); loadSettings();
  </script>
</body>

</html>
